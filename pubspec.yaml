name: darbak
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  go_router: ^14.6.2
  google_maps_flutter: ^2.17.1
  equatable: ^2.0.8
  shared_preferences: ^2.5.4
  image_picker: ^1.0.7
  flash: ^3.0.0
  lottie: ^3.3.2
  carousel_slider: ^5.1.2
  get_it: ^9.2.1
  flutter_svg: ^2.2.3
  flutter_device_type: ^0.4.0
  auto_size_text: ^3.0.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  smooth_page_indicator: ^2.0.1
  dotted_border: ^2.1.0
  flutter_screenutil: ^5.5.3+2
  intl: ^0.19.0
  http: ^1.6.0

  # push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # ui
  bounce: ^1.0.2
  fluttertoast: ^9.0.0
  widget_zoom: ^0.0.4
  persistent_bottom_nav_bar: ^6.2.1
  device_info_plus: ^12.3.0
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.5
  flutter_launcher_icons: ^0.14.4
  permission_handler: ^12.0.1
  curved_labeled_navigation_bar: ^2.0.6
  flutter_otp_text_field: ^1.5.1+1
  country_picker: ^2.0.27
  dio: ^5.9.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  connectivity_plus: ^7.0.0
  another_flushbar: ^1.12.32
  geolocator: ^14.0.2
  facebook_app_events: ^0.30.5
  app_tracking_transparency: ^2.0.6+1
  google_fonts: ^8.0.2
  cached_network_image_ce: ^4.6.2
  version: ^3.0.2
  skeletonizer: ^2.1.3
  timeago: ^3.7.0
  bloc_test: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_ce_generator: ^1.10.0
  mocktail: ^1.0.4

dependency_overrides:
  intl: any
  package_info_plus: ^8.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Darbak_logoo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/anim/

  fonts:
    - family: ThmanyahSans
      fonts:
        - asset: assets/fonts/ThmanyahSans-Light.otf
          weight: 300
        - asset: assets/fonts/ThmanyahSans-Regular.otf
          weight: 400
        - asset: assets/fonts/ThmanyahSans-Medium.otf
          weight: 500
        - asset: assets/fonts/ThmanyahSans-Bold.otf
          weight: 700
        - asset: assets/fonts/ThmanyahSans-Black.otf
          weight: 900